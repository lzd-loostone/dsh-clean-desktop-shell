<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>悬浮窗设置</title>
<style>
  :root { --bg: #10131a; --panel: #171b24; --line: rgba(255,255,255,.08); --text: rgba(255,255,255,.92); --dim: rgba(255,255,255,.5); --acc: #60a5fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; font-size: 13px; user-select: none; padding: 16px; }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; line-height: 1.5; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .item + .item { border-top: 1px solid var(--line); }
  .label { flex: none; }
  .value { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  input[type=range] { flex: 1 1 auto; accent-color: var(--acc); height: 22px; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #2a2f3a; border-radius: 22px; transition: .15s; cursor: pointer; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #cbd5e1; border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: var(--acc); }
  .switch input:checked + .slider:before { transform: translateX(18px); background: #fff; }
  .seg { display: flex; gap: 4px; background: #202631; border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: var(--acc); color: #fff; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button { flex: 1; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; padding: 8px 0; border-radius: 8px; cursor: pointer; }
  .btns button:hover { border-color: var(--acc); }
  .btns button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
</style>
</head>
<body>
  <h1>任务悬浮球设置</h1>
  <div class="sub">改动即时生效。小鲸鱼吸附在屏幕边缘，半隐待命；悬停展开任务气泡，左键唤起主窗口，右键弹出菜单，拖拽可换边。</div>

  <div class="group">
    <div class="item">
      <span class="label">显示悬浮球</span>
      <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
    </div>
    <div class="item">
      <span class="label">主题</span>
      <div class="seg" id="theme">
        <button data-v="dark">深色</button>
        <button data-v="light">浅色</button>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="item">
      <span class="label">圆圈大小</span>
      <input type="range" id="orbSize" min="40" max="96" step="2" />
      <span class="value" id="orbSize-v"></span>
    </div>
    <div class="item">
      <span class="label">背景透明度</span>
      <input type="range" id="opacity" min="20" max="100" step="1" />
      <span class="value" id="opacity-v"></span>
    </div>
    <div class="item">
      <span class="label">字号</span>
      <input type="range" id="fontSize" min="11" max="18" step="1" />
      <span class="value" id="fontSize-v"></span>
    </div>
    <div class="item">
      <span class="label">气泡自动收起</span>
      <input type="range" id="hideSec" min="2" max="15" step="1" />
      <span class="value" id="hideSec-v"></span>
    </div>
  </div>

  <div class="btns">
    <button id="reset">重置位置</button>
    <button id="close" class="primary">完成</button>
  </div>

<script>
  var cur = { theme: 'dark', opacity: 0.86, fontSize: 13, enabled: true, orbSize: 56, bubbleTimeout: 5000 }
  var t = null
  function push(patch) {
    cur = Object.assign(cur, patch)
    paint()
    if (t) clearTimeout(t)
    t = setTimeout(function () { window.settingsAPI.set(patch); t = null }, 120)
  }
  function paint() {
    document.getElementById('enabled').checked = !!cur.enabled
    document.getElementById('opacity').value = Math.round(cur.opacity * 100)
    document.getElementById('opacity-v').textContent = Math.round(cur.opacity * 100) + '%'
    document.getElementById('fontSize').value = cur.fontSize
    document.getElementById('fontSize-v').textContent = cur.fontSize + 'px'
    document.getElementById('orbSize').value = cur.orbSize
    document.getElementById('orbSize-v').textContent = cur.orbSize + 'px'
    document.getElementById('hideSec').value = Math.round((cur.bubbleTimeout || 5000) / 1000)
    document.getElementById('hideSec-v').textContent = Math.round((cur.bubbleTimeout || 5000) / 1000) + 's'
    var btns = document.querySelectorAll('#theme button')
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.v === cur.theme)
  }
  document.getElementById('enabled').addEventListener('change', function (e) { push({ enabled: e.target.checked }) })
  document.getElementById('opacity').addEventListener('input', function (e) { push({ opacity: Number(e.target.value) / 100 }) })
  document.getElementById('fontSize').addEventListener('input', function (e) { push({ fontSize: Number(e.target.value) }) })
  document.getElementById('orbSize').addEventListener('input', function (e) { push({ orbSize: Number(e.target.value) }) })
  document.getElementById('hideSec').addEventListener('input', function (e) { push({ bubbleTimeout: Number(e.target.value) * 1000 }) })
  document.getElementById('theme').addEventListener('click', function (e) {
    var b = e.target.closest('button')
    if (b) push({ theme: b.dataset.v })
  })
  document.getElementById('reset').addEventListener('click', function () { window.settingsAPI.resetPos() })
  document.getElementById('close').addEventListener('click', function () { window.settingsAPI.close() })
  window.settingsAPI.onConfig(function (c) { cur = Object.assign({}, cur, c); paint() })
  window.settingsAPI.get().then(function (c) { cur = Object.assign({}, cur, c); paint() })
</script>
</body>
</html>
