<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
<title>悬浮球设置</title>
<style>
  :root {
    --bg: rgba(21, 24, 32, 0.985);
    --border: rgba(255, 255, 255, 0.12);
    --text: rgba(255, 255, 255, 0.94);
    --dim: rgba(255, 255, 255, 0.5);
    --faint: rgba(255, 255, 255, 0.34);
    --field: rgba(255, 255, 255, 0.06);
    --field-border: rgba(255, 255, 255, 0.09);
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --hover: rgba(255, 255, 255, 0.08);
  }
  body.light {
    --bg: rgba(249, 250, 253, 0.99);
    --border: rgba(20, 24, 33, 0.12);
    --text: rgba(20, 24, 33, 0.96);
    --dim: rgba(20, 24, 33, 0.55);
    --faint: rgba(20, 24, 33, 0.38);
    --field: rgba(20, 30, 50, 0.05);
    --field-border: rgba(20, 30, 50, 0.09);
    --hover: rgba(20, 30, 50, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: transparent; }
  body {
    background: transparent;
    padding: 10px;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .win {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg);
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 8px 0 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0));
    border-bottom: 1px solid var(--field-border);
    -webkit-app-region: drag;
  }
  header .logo { width: 16px; height: 16px; display: block; filter: invert(1); }
  body.light header .logo { filter: none; }
  header .htitle { flex: 1 1 auto; font-size: 12.5px; font-weight: 600; letter-spacing: .3px; color: var(--dim); }
  header .x {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; border: 0; border-radius: 7px;
    background: transparent; color: var(--dim);
    font-size: 13px; line-height: 1; cursor: pointer;
  }
  header .x:hover { background: rgba(235, 80, 80, 0.16); color: #ff7b7b; }
  main { padding: 4px 16px 14px; }
  .sec { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: var(--faint); margin: 14px 2px 6px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 38px; gap: 12px;
  }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--field); border: 1px solid var(--field-border); border-radius: 22px; transition: .15s; cursor: pointer; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #cbd5e1; border-radius: 50%; transition: .18s cubic-bezier(.4,1.4,.6,1); }
  .switch input:checked + .slider { background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-color: transparent; }
  .switch input:checked + .slider:before { transform: translateX(18px); background: #fff; }
  .seg { display: flex; background: var(--field); border: 1px solid var(--field-border); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 12px; padding: 4px 14px; border-radius: 6px; cursor: pointer; transition: .12s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(79, 140, 255, 0.35); }
  .ctrl { padding: 6px 2px 8px; }
  .ctrl .cap { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .ctrl .cap .name { color: var(--text); }
  .ctrl .cap .val { color: var(--accent); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; background: transparent; cursor: pointer;
    --p: 50%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent) 0 var(--p), var(--field) var(--p) 100%);
    border: 1px solid var(--field-border);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 1px solid rgba(0,0,0,.15);
    margin-top: -6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
    transition: transform .12s ease;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.28); }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns button {
    flex: 1; height: 32px;
    border: 1px solid var(--field-border); background: var(--field);
    color: var(--text); font: inherit; border-radius: 8px; cursor: pointer;
    transition: .12s;
  }
  .btns button:hover { border-color: var(--accent); }
  .btns button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 600;
    box-shadow: 0 3px 12px rgba(79, 140, 255, 0.35);
  }
  .btns button.primary:hover { filter: brightness(1.1); }
  .hint { margin-top: 10px; text-align: center; font-size: 11px; color: var(--faint); }
</style>
</head>
<body>
  <div class="win">
    <header>
      <img class="logo" src="../build/icon.png" alt="" />
      <span class="htitle">悬浮球设置</span>
      <button class="x" id="x" title="关闭">✕</button>
    </header>
    <main>
      <div class="sec">基础</div>
      <div class="row">
        <span>显示悬浮球</span>
        <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
      </div>
      <div class="row">
        <span>主题</span>
        <div class="seg" id="theme">
          <button data-v="dark">深色</button>
          <button data-v="light">浅色</button>
        </div>
      </div>

      <div class="sec">外观与行为</div>
      <div class="ctrl">
        <div class="cap"><span class="name">圆圈大小</span><span class="val" id="orbSize-v"></span></div>
        <input type="range" id="orbSize" min="40" max="96" step="2" />
      </div>
      <div class="ctrl">
        <div class="cap"><span class="name">背景透明度</span><span class="val" id="opacity-v"></span></div>
        <input type="range" id="opacity" min="20" max="100" step="1" />
      </div>
      <div class="ctrl">
        <div class="cap"><span class="name">字号</span><span class="val" id="fontSize-v"></span></div>
        <input type="range" id="fontSize" min="11" max="18" step="1" />
      </div>
      <div class="ctrl">
        <div class="cap"><span class="name">气泡自动收起</span><span class="val" id="hideSec-v"></span></div>
        <input type="range" id="hideSec" min="2" max="15" step="1" />
      </div>

      <div class="btns">
        <button id="reset">重置位置</button>
        <button id="close" class="primary">完成</button>
      </div>
      <div class="hint">拖动标题栏移动窗口 · 改动即时生效</div>
    </main>
  </div>
<script>
  var cur = { theme: 'dark', opacity: 0.86, fontSize: 13, enabled: true, orbSize: 56, bubbleTimeout: 5000 }
  var t = null
  function push(patch) {
    cur = Object.assign(cur, patch)
    paint()
    if (t) clearTimeout(t)
    t = setTimeout(function () { window.settingsAPI.set(patch); t = null }, 120)
  }
  function fill(el) {
    var pct = ((el.value - el.min) / (el.max - el.min)) * 100
    el.style.setProperty('--p', pct + '%')
  }
  function paint() {
    document.getElementById('enabled').checked = !!cur.enabled
    var op = document.getElementById('opacity'); op.value = Math.round(cur.opacity * 100); fill(op)
    document.getElementById('opacity-v').textContent = Math.round(cur.opacity * 100) + '%'
    var fs = document.getElementById('fontSize'); fs.value = cur.fontSize; fill(fs)
    document.getElementById('fontSize-v').textContent = cur.fontSize + 'px'
    var os = document.getElementById('orbSize'); os.value = cur.orbSize; fill(os)
    document.getElementById('orbSize-v').textContent = cur.orbSize + 'px'
    var hs = document.getElementById('hideSec'); hs.value = Math.round((cur.bubbleTimeout || 5000) / 1000); fill(hs)
    document.getElementById('hideSec-v').textContent = Math.round((cur.bubbleTimeout || 5000) / 1000) + 's'
    var btns = document.querySelectorAll('#theme button')
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.v === cur.theme)
    document.body.classList.toggle('light', cur.theme === 'light')
  }
  function reportSize() {
    var h = document.querySelector('.win').getBoundingClientRect().height + 20
    window.settingsAPI.size(Math.ceil(h))
  }
  document.getElementById('enabled').addEventListener('change', function (e) { push({ enabled: e.target.checked }) })
  document.getElementById('opacity').addEventListener('input', function (e) { fill(e.target); push({ opacity: Number(e.target.value) / 100 }) })
  document.getElementById('fontSize').addEventListener('input', function (e) { fill(e.target); push({ fontSize: Number(e.target.value) }) })
  document.getElementById('orbSize').addEventListener('input', function (e) { fill(e.target); push({ orbSize: Number(e.target.value) }) })
  document.getElementById('hideSec').addEventListener('input', function (e) { fill(e.target); push({ bubbleTimeout: Number(e.target.value) * 1000 }) })
  document.getElementById('theme').addEventListener('click', function (e) {
    var b = e.target.closest('button')
    if (b) push({ theme: b.dataset.v })
  })
  document.getElementById('reset').addEventListener('click', function () { window.settingsAPI.resetPos() })
  document.getElementById('close').addEventListener('click', function () { window.settingsAPI.close() })
  document.getElementById('x').addEventListener('click', function () { window.settingsAPI.close() })
  window.settingsAPI.onConfig(function (c) { cur = Object.assign({}, cur, c); paint() })
  window.settingsAPI.get().then(function (c) { cur = Object.assign({}, cur, c); paint(); reportSize() })
</script>
</body>
</html>
