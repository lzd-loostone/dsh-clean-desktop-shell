<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>DSH 气泡窗</title>
<style>
  :root {
    --alpha: 0.86;
    --fs: 13px;
    --card-bg: rgba(16, 19, 26, var(--alpha));
    --card-border: rgba(255, 255, 255, 0.14);
    --text: rgba(255, 255, 255, 0.95);
    --text-dim: rgba(255, 255, 255, 0.55);
    --row-hover: rgba(255, 255, 255, 0.09);
    --track: rgba(255, 255, 255, 0.06);
  }
  body.light {
    --card-bg: rgba(246, 247, 250, var(--alpha));
    --card-border: rgba(0, 0, 0, 0.10);
    --text: rgba(20, 24, 33, 0.95);
    --text-dim: rgba(20, 24, 33, 0.55);
    --row-hover: rgba(0, 0, 0, 0.06);
    --track: rgba(0, 0, 0, 0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: var(--fs);
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: absolute; inset: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    overflow: hidden;
    opacity: 0;
    transform: scale(.9);
    transition: opacity .16s cubic-bezier(0.16, 1, 0.3, 1), transform .16s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card.in { opacity: 1; transform: scale(1); }
  .card.out { transition-duration: .11s; transition-timing-function: ease-in; }
  .card.from-right { transform-origin: right center; } /* bubble left of orb */
  .card.from-left { transform-origin: left center; }
  .card::after {
    content: "";
    position: absolute; top: var(--tailtop, 28px);
    width: 10px; height: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    transform: translateY(-50%) rotate(45deg);
  }
  .card.from-right::after { right: -6px; border-left: 0; border-bottom: 0; }
  .card.from-left::after { left: -6px; border-right: 0; border-top: 0; }
  .bar { height: 3px; background: linear-gradient(90deg, #34d399, #60a5fa, #a78bfa, #f472b6); opacity: .85; }
  .bhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .bhead .title { font-size: calc(var(--fs) + 1.5px); font-weight: 600; letter-spacing: .2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #34d399; }
  .dot.pulse { animation: dotpulse 1.6s ease-in-out infinite; }
  @keyframes dotpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, .55); }
    55% { box-shadow: 0 0 0 6px rgba(96, 165, 250, 0); }
  }
  .rows { display: flex; flex-direction: column; gap: 2px; padding: 2px 6px 8px; }
  .row {
    display: flex; align-items: center; gap: 9px;
    height: 40px; padding: 0 10px;
    border-radius: 9px; cursor: pointer;
    transition: background-color .12s ease;
  }
  .row:hover { background: var(--row-hover); }
  .row .badge2 { flex: none; font-size: calc(var(--fs) - 2px); font-weight: 600; padding: 2.5px 7px; border-radius: 6px; white-space: nowrap; background: var(--track); }
  .row.running .badge2 { color: #60a5fa; }
  .row.approval .badge2 { color: #fbbf24; }
  .row.question .badge2 { color: #f472b6; }
  .row.done .badge2 { color: var(--text-dim); }
  .row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done .name { color: var(--text-dim); }
  .row .unread { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #e2e8f0; box-shadow: 0 0 6px rgba(226,232,240,.8); }
  body.light .row .unread { background: #334155; box-shadow: none; }
  .empty { padding: 10px 16px 16px; color: var(--text-dim); font-size: calc(var(--fs) - 1px); }
  .more { padding: 0 16px 10px; color: var(--text-dim); font-size: calc(var(--fs) - 2px); }
  .row.flash { animation-duration: 1s; animation-timing-function: ease-out; animation-iteration-count: 2; }
  .row.approval.flash { animation-name: flashAmber; }
  .row.question.flash { animation-name: flashPink; }
  .row.done.flash { animation-name: flashWhite; }
  @keyframes flashAmber { 0%,100% { background: transparent; } 35% { background: rgba(251, 191, 36, .42); } }
  @keyframes flashPink  { 0%,100% { background: transparent; } 35% { background: rgba(244, 114, 182, .42); } }
  @keyframes flashWhite { 0%,100% { background: transparent; } 35% { background: rgba(226, 232, 240, .40); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bar"></div>
    <div class="bhead">
      <span class="dot" id="dot"></span>
      <span class="title" id="title">DSH 空闲</span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="more" id="more" hidden></div>
  </div>
<script>
  var KIND_LABEL = { running: '处理中', approval: '需要审批', question: '需要回答', done: '已完成' }
  var MODE_TITLE = { idle: 'DSH 空闲', offline: '后端未连接', missing: '未接入状态源' }
  var FLASH_KINDS = { approval: true, question: true, done: true }
  var shown = false
  var first = true
  var lastKind = {}

  function render(d) {
    var card = document.getElementById('card')
    card.classList.toggle('from-right', d.bubbleSide === 'left')
    card.classList.toggle('from-left', d.bubbleSide === 'right')
    if (d.orbSize) card.style.setProperty('--tailtop', Math.round(d.orbSize / 2) + 'px')
    var title = document.getElementById('title')
    var dot = document.getElementById('dot')
    var rowsEl = document.getElementById('rows')
    var moreEl = document.getElementById('more')
    dot.className = 'dot'
    if (d.mode === 'idle') { title.textContent = MODE_TITLE.idle; dot.style.background = '#34d399' }
    else if (d.mode === 'active') { title.textContent = d.runningCount + ' 个会话运行中'; dot.style.background = '#60a5fa'; dot.classList.add('pulse') }
    else { title.textContent = MODE_TITLE[d.mode] || MODE_TITLE.offline; dot.style.background = '#64748b' }

    rowsEl.innerHTML = ''
    var list = d.rows || []
    if (list.length === 0) {
      var e = document.createElement('div')
      e.className = 'empty'
      e.textContent = d.mode === 'missing' ? '在 cordis 中启用桌面壳插件后显示' : '等待任务开始…'
      rowsEl.appendChild(e)
    }
    for (var i = 0; i < list.length; i++) rowsEl.appendChild(makeRow(list[i]))
    moreEl.hidden = !d.more
    if (d.more) moreEl.textContent = '+ 还有 ' + d.more + ' 个会话…'

    if (!shown) {
      shown = true
      card.classList.remove('out')
      // paint hidden first, then animate in — the window may become visible
      // before this page gets a frame, so double-rAF guarantees the transition
      requestAnimationFrame(function () { requestAnimationFrame(function () { card.classList.add('in') }) })
    }
    first = false
    // Measure the real content height and report it — the main process
    // formula is only the first-frame estimate, so the card never keeps
    // dead space below the list.
    var hh = 0
    var kids = card.children
    for (var k = 0; k < kids.length; k++) hh += kids[k].offsetHeight
    try { window.bubbleAPI.size(Math.ceil(hh) + 2) } catch (err) {}
  }

  function makeRow(r) {
    var el = document.createElement('div')
    el.className = 'row ' + r.kind
    el.title = r.name
    var changed = lastKind[r.id] !== r.kind
    var badge = document.createElement('span')
    badge.className = 'badge2'
    badge.textContent = KIND_LABEL[r.kind] || r.kind
    var name = document.createElement('span')
    name.className = 'name'
    name.textContent = r.name
    el.appendChild(badge)
    el.appendChild(name)
    if (r.kind === 'done') {
      var u = document.createElement('span')
      u.className = 'unread'
      el.appendChild(u)
    }
    if (!first && FLASH_KINDS[r.kind] && changed) {
      el.classList.add('flash')
      el.addEventListener('animationend', function () { el.classList.remove('flash') })
    }
    lastKind[r.id] = r.kind
    el.addEventListener('click', function (ev) {
      ev.stopPropagation()
      window.bubbleAPI.rowClick(r.id)
    })
    return el
  }

  document.getElementById('card').addEventListener('click', function () { window.bubbleAPI.blankClick() })
  document.body.addEventListener('mouseenter', function () { window.bubbleAPI.hover(true) })
  document.body.addEventListener('mouseleave', function () { window.bubbleAPI.hover(false) })

  window.bubbleAPI.onState(render)
  window.bubbleAPI.onHide(function () {
    shown = false
    var card = document.getElementById('card')
    card.classList.add('out')
    card.classList.remove('in')
  })
  window.bubbleAPI.onConfig(function (c) {
    document.documentElement.style.setProperty('--alpha', String(c.opacity))
    document.documentElement.style.setProperty('--fs', (c.fontSize || 13) + 'px')
    document.body.classList.toggle('light', c.theme === 'light')
  })
  window.bubbleAPI.ready()
</script>
</body>
</html>
