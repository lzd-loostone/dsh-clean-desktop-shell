<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>DSH 悬浮球菜单</title>
<style>
  :root {
    --menu-bg: rgba(22, 25, 33, 0.97);
    --menu-border: rgba(255, 255, 255, 0.14);
    --text: rgba(255, 255, 255, 0.92);
    --dim: rgba(255, 255, 255, 0.45);
    --hover: rgba(255, 255, 255, 0.09);
    --sep: rgba(255, 255, 255, 0.09);
    --accent: #60a5fa;
  }
  body.light {
    --menu-bg: rgba(248, 249, 252, 0.98);
    --menu-border: rgba(0, 0, 0, 0.10);
    --text: rgba(20, 24, 33, 0.95);
    --dim: rgba(20, 24, 33, 0.5);
    --hover: rgba(0, 0, 0, 0.06);
    --sep: rgba(0, 0, 0, 0.08);
    --accent: #2563eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: var(--fs, 13px);
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .menu {
    position: absolute; inset: 0;
    background: var(--menu-bg);
    border: 1px solid var(--menu-border);
    border-radius: 10px;
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    padding: 8px 6px;
    opacity: 0;
    transform: scale(.96);
    transition: opacity .1s ease, transform .1s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }
  .menu.in { opacity: 1; transform: scale(1); }
  .item {
    display: flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 10px;
    border-radius: 7px; cursor: pointer;
    white-space: nowrap;
  }
  .item:hover { background: var(--hover); }
  .item .ico { flex: none; width: 16px; text-align: center; color: var(--dim); font-size: 13px; }
  .item:hover .ico { color: var(--accent); }
  .item .label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .item .kbd { color: var(--dim); font-size: 11px; }
  .sep { height: 9px; position: relative; }
  .sep::after { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 1px; background: var(--sep); }
</style>
</head>
<body>
  <div class="menu" id="menu"></div>
<script>
  var built = false

  function build(online) {
    var menu = document.getElementById('menu')
    menu.innerHTML = ''
    function item(id, ico, label) {
      var el = document.createElement('div')
      el.className = 'item'
      var i = document.createElement('span'); i.className = 'ico'; i.textContent = ico
      var l = document.createElement('span'); l.className = 'label'; l.textContent = label
      el.appendChild(i); el.appendChild(l)
      el.addEventListener('click', function () { window.menuAPI.action(id) })
      menu.appendChild(el)
    }
    function sep() { var s = document.createElement('div'); s.className = 'sep'; menu.appendChild(s) }
    item('refresh', '\u27F3', '刷新窗口')
    sep()
    if (online) {
      item('restart', '\u21BB', '重启后端')
      item('stop', '\u23FB', '关闭后端')
    } else {
      item('start', '\u25B6', '启动后端')
    }
    sep()
    item('settings', '\u2699', '悬浮窗设置')
    if (!built) {
      built = true
      requestAnimationFrame(function () { requestAnimationFrame(function () { menu.classList.add('in') }) })
    } else {
      menu.classList.add('in')
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') window.menuAPI.close()
  })
  document.body.addEventListener('mouseleave', function (e) {
    // leaving through the top edge usually means the pointer left the menu —
    // let the main process blur handler decide; do nothing here.
  })

  window.menuAPI.onState(function (d) { build(!!d.online) })
  window.menuAPI.onConfig(function (c) {
    document.documentElement.style.setProperty('--fs', (c.fontSize || 13) + 'px')
    document.body.classList.toggle('light', c.theme === 'light')
  })
  window.menuAPI.ready()
</script>
</body>
</html>
