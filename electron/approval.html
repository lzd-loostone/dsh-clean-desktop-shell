<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>DSH 互动详情</title>
<style>
  :root {
    --alpha: 0.9;
    --fs: 13px;
    --card-bg: rgba(16, 19, 26, var(--alpha));
    --card-border: rgba(255, 255, 255, 0.14);
    --text: rgba(255, 255, 255, 0.95);
    --text-dim: rgba(255, 255, 255, 0.55);
    --row-hover: rgba(255, 255, 255, 0.09);
    --track: rgba(255, 255, 255, 0.06);
    --amber: #fbbf24;
    --pink: #f472b6;
  }
  body.light {
    --card-bg: rgba(246, 247, 250, var(--alpha));
    --card-border: rgba(0, 0, 0, 0.10);
    --text: rgba(20, 24, 33, 0.95);
    --text-dim: rgba(20, 24, 33, 0.55);
    --row-hover: rgba(0, 0, 0, 0.06);
    --track: rgba(0, 0, 0, 0.05);
    --amber: #d97706;
    --pink: #db2777;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: var(--fs);
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: absolute; inset: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    overflow: hidden;
    opacity: 0;
    transform: scale(.9);
    transition: opacity .16s cubic-bezier(0.16, 1, 0.3, 1), transform .16s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    display: flex; flex-direction: column;
  }
  .card.in { opacity: 1; transform: scale(1); }
  .card.out { transition-duration: .11s; transition-timing-function: ease-in; }
  .card.from-left { transform-origin: left center; } /* detail right of bubble → tail left */
  .card.from-right { transform-origin: right center; }
  .card::after {
    content: "";
    position: absolute; top: var(--tailtop, 34px);
    width: 10px; height: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    transform: translateY(-50%) rotate(45deg);
  }
  .card.from-left::after { left: -6px; border-right: 0; border-top: 0; }
  .card.from-right::after { right: -6px; border-left: 0; border-bottom: 0; }
  .bar { height: 3px; flex: none; background: linear-gradient(90deg, #fbbf24, #f472b6, #a78bfa); opacity: .9; }
  .bar.q { background: linear-gradient(90deg, #f472b6, #a78bfa, #38bdf8); }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; flex: none; }
  .head .badge2 { flex: none; font-size: calc(var(--fs) - 2px); font-weight: 600; padding: 2.5px 7px; border-radius: 6px; white-space: nowrap; background: var(--track); color: var(--amber); }
  .head .badge2.q { color: var(--pink); }
  .head .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .body { padding: 2px 14px 4px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .toolrow { display: flex; align-items: baseline; gap: 7px; }
  .toolrow .lab { color: var(--text-dim); font-size: calc(var(--fs) - 1px); flex: none; }
  .toolrow .tool { font-weight: 600; font-size: calc(var(--fs) + 1px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason { margin-top: 5px; color: var(--text); opacity: .92; line-height: 1.45; font-size: calc(var(--fs) - 0.5px); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; user-select: text; }
  /* ---------- question zone ---------- */
  .qhead { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .qhead .qlab { flex: 1 1 auto; min-width: 0; color: var(--text-dim); font-size: calc(var(--fs) - 2px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pager { display: flex; align-items: center; gap: 3px; flex: none; }
  .pager button { font: inherit; font-size: calc(var(--fs) + 1px); line-height: 1; width: 20px; height: 20px; border: 1px solid var(--card-border); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
  .pager button:hover:not(:disabled) { background: var(--row-hover); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager .pg { min-width: 34px; text-align: center; color: var(--text-dim); font-size: calc(var(--fs) - 2px); }
  .qtext { margin-top: 4px; line-height: 1.45; font-size: calc(var(--fs) + 0.5px); font-weight: 600; user-select: text; }
  .qdetail { margin-top: 5px; color: var(--text-dim); font-size: calc(var(--fs) - 1px); line-height: 1.4; max-height: 66px; overflow-y: auto; border-left: 2px solid var(--card-border); padding-left: 8px; user-select: text; }
  .qopts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 186px; overflow-y: auto; }
  .qopts .opt { font: inherit; font-size: calc(var(--fs) - 0.5px); text-align: left; padding: 6px 9px; background: var(--track); border: 1px solid transparent; border-radius: 8px; color: var(--text); cursor: pointer; line-height: 1.35; transition: border-color .12s ease, background-color .12s ease; }
  .qopts .opt:hover { border-color: rgba(244, 114, 182, .55); }
  .qopts .opt.sel { border-color: var(--pink); background: rgba(244, 114, 182, .16); }
  .qhint { margin-top: 7px; color: var(--text-dim); font-size: calc(var(--fs) - 1px); line-height: 1.4; }
  .qfree { margin-top: 8px; display: flex; gap: 6px; }
  .qfree input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: calc(var(--fs) - 0.5px); padding: 5px 8px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--track); color: var(--text); outline: none; }
  .qfree input:focus { border-color: var(--pink); }
  /* ---------- actions ---------- */
  .acts { display: flex; gap: 8px; padding: 9px 14px 12px; flex: none; }
  .acts button {
    font: inherit; font-size: calc(var(--fs) - 0.5px); font-weight: 600;
    height: 30px; border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; white-space: nowrap;
    transition: background-color .12s ease, color .12s ease, border-color .12s ease;
  }
  .acts button:disabled { opacity: .45; cursor: default; }
  .acts .allow { flex: none; margin-left: auto; min-width: 132px; padding: 0 22px; font-size: calc(var(--fs) + 0.5px); background: rgba(52, 211, 153, .16); color: #34d399; border-color: rgba(52, 211, 153, .45); }
  .acts .allow:hover:not(:disabled) { background: rgba(52, 211, 153, .30); }
  body.light .acts .allow { background: rgba(5, 150, 105, .12); color: #047857; border-color: rgba(5, 150, 105, .40); }
  .acts .reject { flex: none; padding: 0 12px; background: transparent; color: #f87171; border-color: rgba(248, 113, 113, .35); }
  .acts .reject:hover:not(:disabled) { background: rgba(248, 113, 113, .12); }
  body.light .acts .reject { color: #b91c1c; border-color: rgba(185, 28, 28, .30); }
  .acts .detail { flex: none; padding: 0 12px; background: transparent; color: var(--text-dim); border-color: var(--card-border); }
  .acts .detail:hover:not(:disabled) { color: var(--text); background: var(--row-hover); }
  .acts .submit { flex: none; margin-left: auto; min-width: 124px; padding: 0 20px; background: rgba(244, 114, 182, .16); color: var(--pink); border-color: rgba(244, 114, 182, .45); }
  .acts .submit:hover:not(:disabled) { background: rgba(244, 114, 182, .30); }
  body.light .acts .submit { background: rgba(219, 39, 119, .12); border-color: rgba(219, 39, 119, .40); }
  .meta { margin-top: 5px; color: var(--text-dim); font-size: calc(var(--fs) - 2px); }
  .meta b { color: var(--amber); font-weight: 600; }
  .meta.q b { color: var(--pink); }
  .more { margin-top: 3px; color: var(--text-dim); font-size: calc(var(--fs) - 2px); }
  .done { padding: 6px 14px 13px; font-size: calc(var(--fs) - 0.5px); font-weight: 600; flex: none; }
  .done.ok { color: #34d399; }
  .done.no { color: #f87171; }
  body.light .done.no { color: #b91c1c; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bar" id="bar"></div>
    <div class="head">
      <span class="badge2" id="badge2">需要审批</span>
      <span class="name" id="sessName"></span>
    </div>
    <div class="body" id="body">
      <div id="apzone">
        <div class="toolrow"><span class="lab">请求工具</span><span class="tool" id="toolName"></span></div>
        <div class="reason" id="reason" hidden></div>
      </div>
      <div id="qzone" hidden>
        <div class="qhead">
          <span class="qlab" id="qHeadLab"></span>
          <span class="pager" id="pager" hidden>
            <button id="pgPrev">‹</button><span class="pg" id="pgLab">1/1</span><button id="pgNext">›</button>
          </span>
        </div>
        <div class="qtext" id="qText"></div>
        <div class="qdetail" id="qDetail" hidden></div>
        <div class="qopts" id="qOpts" hidden></div>
        <div class="qfree" id="qFree" hidden><input id="qInput" type="text" placeholder="输入回答，Enter 提交" /></div>
        <div class="qhint" id="qHint" hidden></div>
      </div>
      <div class="meta" id="meta"></div>
      <div class="more" id="moreLine" hidden></div>
    </div>
    <div class="acts" id="acts">
      <button class="detail" id="btnDetail">查看详情</button>
      <button class="reject" id="btnReject">拒绝</button>
      <button class="allow" id="btnAllow">允许一次</button>
    </div>
    <div class="acts" id="qacts" hidden>
      <button class="detail" id="btnQDetail">查看详情</button>
      <button class="submit" id="btnSubmit">提交</button>
    </div>
    <div class="done" id="doneLine" hidden></div>
  </div>
<script>
  var cur = null          // 最近一次 approval:state 载荷（审批或提问）
  var shown = false
  var sigPrev = ''        // sessionId+sinceTs+kind：同一请求的重复推送不重置作答状态
  var page = 0            // 提问翻页游标
  var ans = {}            // pageId -> {selected:[labels], custom:'text'}

  function $(id) { return document.getElementById(id) }

  function render(d) {
    cur = d
    var isQ = d.kind === 'question'
    var ns = String(d.sessionId) + '|' + String(d.sinceTs) + '|' + (isQ ? 'q' : 'a')
    if (shown && ns === sigPrev) { // age/height tick refresh — keep user's in-progress answers
      var bb = $('meta').querySelector('b')
      if (bb) bb.textContent = d.ageLabel || bb.textContent
      measure()
      return
    }
    sigPrev = ns
    var card = $('card')
    card.classList.toggle('from-left', d.tail === 'left')
    card.classList.toggle('from-right', d.tail === 'right')
    $('bar').classList.toggle('q', isQ)
    $('sessName').textContent = d.name || '会话'
    $('sessName').title = d.name || ''
    var badge = $('badge2')
    badge.classList.toggle('q', isQ)
    var meta = $('meta')
    meta.classList.toggle('q', isQ)
    $('apzone').hidden = isQ
    $('qzone').hidden = !isQ
    $('doneLine').hidden = true
    $('acts').hidden = isQ
    $('qacts').hidden = !isQ
    if (isQ) {
      var p0 = (d.pages && d.pages[0]) || null
      badge.textContent = p0 && p0.plan ? '计划评审' : '需要回答'
      page = 0
      ans = {}
      renderQ(d)
    } else {
      badge.textContent = '需要审批'
      $('toolName').textContent = d.toolName || '未知工具'
      var reason = $('reason')
      reason.hidden = !d.reason
      if (d.reason) reason.textContent = d.reason
      for (var i = 0; i < $('acts').children.length; i++) $('acts').children[i].disabled = false
    }
    meta.innerHTML = ''
    var m = document.createElement('span')
    m.textContent = '等待 '
    meta.appendChild(m)
    var b = document.createElement('b')
    b.textContent = d.ageLabel || '…'
    meta.appendChild(b)
    var moreEl = $('moreLine')
    moreEl.hidden = !d.more
    if (d.more) moreEl.textContent = isQ ? ('另有 ' + d.more + ' 批提问在排队') : ('后面还排着 ' + d.more + ' 笔审批，逐笔放行')
    if (!shown) {
      shown = true
      card.classList.remove('out')
      requestAnimationFrame(function () { requestAnimationFrame(function () { card.classList.add('in') }) })
    }
    measure()
  }

  // ---------- question zone ----------
  function pagesOf() { return (cur && Array.isArray(cur.pages)) ? cur.pages : [] }
  function curPage() { var ps = pagesOf(); return ps.length ? ps[Math.min(page, ps.length - 1)] : null }
  function ansOf(id) { return ans[id] || (ans[id] = { selected: [], custom: '' }) }
  function answeredCount() {
    var n = 0
    pagesOf().forEach(function (p) { if (isPageAnswered(p)) n++ })
    return n
  }
  function isPageAnswered(p) {
    var a = ans[p.id]
    if (!a) return false
    if (p.opts && p.opts.length) return a.selected.length > 0
    return typeof a.custom === 'string' && a.custom.trim().length > 0
  }
  function allAnswered() { var ps = pagesOf(); return ps.length > 0 && answeredCount() === ps.length }

  function renderQ(d) {
    var ps = d.pages || []
    var p = curPage()
    $('pager').hidden = ps.length <= 1
    if (ps.length > 1) {
      $('pgLab').textContent = (page + 1) + '/' + ps.length
      $('pgPrev').disabled = page <= 0
      $('pgNext').disabled = page >= ps.length - 1
    }
    $('qHeadLab').textContent = p && p.header ? p.header : ''
    $('qHeadLab').hidden = !(p && p.header)
    $('qText').textContent = p ? p.q : ''
    var det = $('qDetail')
    det.hidden = !(p && p.detail)
    if (p && p.detail) det.textContent = p.detail
    var opts = $('qOpts')
    opts.innerHTML = ''
    opts.hidden = true
    var free = $('qFree')
    free.hidden = true
    var hint = $('qHint')
    hint.hidden = true
    if (!p) return
    if (d.uiOnly) {
      hint.hidden = false
      hint.textContent = '这批提问内容较多或含气泡不便作答的项，请在 DSH 界面完成作答'
      $('btnSubmit').hidden = true
      return
    }
    if (p.opts && p.opts.length) {
      opts.hidden = false
      var a = ansOf(p.id)
      p.opts.forEach(function (label) {
        var btn = document.createElement('button')
        btn.type = 'button'
        btn.className = 'opt' + (a.selected.indexOf(label) !== -1 ? ' sel' : '')
        btn.textContent = (p.multi && a.selected.indexOf(label) !== -1 ? '✓ ' : '') + label
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation()
          onOption(p, label)
        })
        opts.appendChild(btn)
      })
    } else {
      free.hidden = false
      var input = $('qInput')
      input.value = ansOf(p.id).custom || ''
      input.placeholder = '输入回答，Enter 提交'
    }
    // submit visibility: single quick-pick question answers on click;
    // everything else submits through the button (multi = 勾选+确认).
    var quick = ps.length === 1 && p.opts && p.opts.length && !p.multi
    $('btnSubmit').hidden = !!quick
    $('btnSubmit').disabled = !allAnswered()
    $('btnSubmit').textContent = ps.length > 1 ? ('提交（' + answeredCount() + '/' + ps.length + ' 已答）') : '提交'
  }

  function onOption(p, label) {
    var a = ansOf(p.id)
    if (p.multi) {
      var at = a.selected.indexOf(label)
      if (at === -1) a.selected.push(label)
      else a.selected.splice(at, 1)
      a.selected = a.selected.slice()
      refreshQ()
      return
    }
    var ps = pagesOf()
    if (ps.length === 1) { submitAnswers(p.id, [label]); return } // quick pick
    a.selected = [label]
    // jump to the next unanswered page so paging flows without extra clicks
    for (var k = 1; k <= ps.length; k++) {
      var idx = (page + k) % ps.length
      if (!isPageAnswered(ps[idx])) { page = idx; break }
    }
    refreshQ()
  }

  function refreshQ() {
    if (cur && cur.kind === 'question') { renderQ(cur); measure() }
  }

  function buildAnswers() {
    return pagesOf().map(function (p) {
      var a = ansOf(p.id)
      var item = { id: p.id, selected: (a.selected || []).slice() }
      var custom = typeof a.custom === 'string' ? a.custom.trim() : ''
      if (!p.opts && custom) item.custom = custom
      return item
    })
  }

  function submitAnswers(qid, labels) {
    var a = ansOf(qid)
    a.selected = labels
    var answers = buildAnswers()
    act({ id: cur.sessionId, action: 'answer', answers: answers })
    settleUi('ok', '✓ 已提交，任务继续执行中…')
  }

  function settleUi(kind, text) {
    $('acts').hidden = true
    $('qacts').hidden = true
    var done = $('doneLine')
    done.hidden = false
    done.className = 'done ' + kind
    done.textContent = text
    measure()
  }

  function act(payload) {
    try { window.approvalAPI.act(payload) } catch (err) {}
  }

  function actApproval(action) {
    if (!cur || !cur.sessionId) return
    if (action === 'allow') settleUi('ok', '✓ 已允许一次，正在放行该任务…')
    else if (action === 'reject') settleUi('no', '✗ 已拒绝该审批')
    act({ id: cur.sessionId, action: action })
  }

  function measure() {
    var card = $('card')
    var hh = 0
    var kids = card.children
    for (var k = 0; k < kids.length; k++) hh += kids[k].offsetHeight
    try { window.approvalAPI.size(Math.ceil(hh) + 2) } catch (err) {}
  }

  $('btnAllow').addEventListener('click', function (ev) { ev.stopPropagation(); actApproval('allow') })
  $('btnReject').addEventListener('click', function (ev) { ev.stopPropagation(); actApproval('reject') })
  $('btnDetail').addEventListener('click', function (ev) { ev.stopPropagation(); actApproval('detail') })
  $('btnQDetail').addEventListener('click', function (ev) { ev.stopPropagation(); actApproval('detail') })
  $('btnSubmit').addEventListener('click', function (ev) {
    ev.stopPropagation()
    if (!cur || !allAnswered()) return
    submitAnswers(null, null)
  })
  $('pgPrev').addEventListener('click', function (ev) { ev.stopPropagation(); if (page > 0) { page--; refreshQ() } })
  $('pgNext').addEventListener('click', function (ev) { ev.stopPropagation(); var ps = pagesOf(); if (page < ps.length - 1) { page++; refreshQ() } })
  var qEl = $('qInput')
  function wantInput() {
    act({ id: cur ? cur.sessionId : '', action: 'want-input' })
    // Main flips the window focusable asynchronously; the original click
    // could not give DOM focus while the window was unfocusable. Retry so
    // the caret lands in the input right after the promotion.
    setTimeout(function () { qEl.focus() }, 80)
    setTimeout(function () { qEl.focus() }, 260)
  }
  qEl.addEventListener('pointerdown', wantInput)
  qEl.addEventListener('touchstart', wantInput)
  $('qInput').addEventListener('input', function (ev) {
    var p = curPage()
    if (p) { ansOf(p.id).custom = ev.target.value }
    if (cur) { $('btnSubmit').disabled = !allAnswered(); if (pagesOf().length > 1) $('btnSubmit').textContent = '提交（' + answeredCount() + '/' + pagesOf().length + ' 已答）' }
  })
  $('qInput').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return
    ev.preventDefault()
    var ps = pagesOf()
    if (allAnswered()) {
      if (ps.length === 1) submitAnswers(null, null)
      return
    }
    if (ps.length > 1) { // park on the next unanswered page
      for (var k = 1; k <= ps.length; k++) {
        var idx = (page + k) % ps.length
        if (!isPageAnswered(ps[idx])) { page = idx; refreshQ(); return }
      }
    }
  })
  $('card').addEventListener('click', function (ev) {
    if (ev.target.closest && ev.target.closest('button, input')) return
    actApproval('detail')
  })
  document.body.addEventListener('mouseenter', function () { window.approvalAPI.hover(true) })
  document.body.addEventListener('mouseleave', function () { window.approvalAPI.hover(false) })

  window.approvalAPI.onState(render)
  window.approvalAPI.onHide(function () {
    shown = false
    sigPrev = ''
    page = 0
    ans = {}
    var card = $('card')
    card.classList.add('out')
    card.classList.remove('in')
  })
  window.approvalAPI.onConfig(function (c) {
    document.documentElement.style.setProperty('--alpha', String(c.opacity))
    document.documentElement.style.setProperty('--fs', (c.fontSize || 13) + 'px')
    document.body.classList.toggle('light', c.theme === 'light')
  })
  window.approvalAPI.ready()
</script>
</body>
</html>
