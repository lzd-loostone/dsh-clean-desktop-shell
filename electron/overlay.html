<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
<title>DSH 小鲸鱼</title>
<style>
  :root {
    --alpha: 0.86;
    --orb: 56px;
    --shift: 0px;
    --orb-face: linear-gradient(145deg, rgba(30, 36, 50, var(--alpha)), rgba(14, 17, 24, var(--alpha)));
    --orb-stroke: rgba(255, 255, 255, 0.16);
    --badge-bg: #2563eb;
    --badge-text: #fff;
  }
  body.light {
    --orb-face: linear-gradient(145deg, rgba(255, 255, 255, var(--alpha)), rgba(232, 236, 243, var(--alpha)));
    --orb-stroke: rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body { user-select: none; -webkit-font-smoothing: antialiased; }
  /* The container is the window itself (s×s, always fully on one display).
     The whale slides inside it — docked half hides behind the window edge,
     which visually reads as "half past the screen border" without the
     window ever crossing a monitor boundary. */
  .stage { position: relative; width: 100%; height: 100%; }
  .shift {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transform: translateX(var(--shift));
    transition: transform .16s cubic-bezier(0.16, 1, 0.3, 1);
  }
  body.dragging .shift { transition: none; }
  .orb {
    position: relative;
    width: var(--orb); height: var(--orb);
    border-radius: 50%;
    background: var(--orb-face);
    border: 1px solid var(--orb-stroke);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), inset 0 -6px 14px rgba(0, 0, 0, 0.22);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: none;
    transition: transform .15s ease;
  }
  .orb:hover { transform: scale(1.06); }
  .orb:active { transform: scale(.97); }
  .whale { width: calc(var(--orb) * 0.6); height: calc(var(--orb) * 0.6); display: block; pointer-events: none; -webkit-user-drag: none; }
  body:not(.light) .whale { filter: invert(1); }
  .ring {
    position: absolute; inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(96, 165, 250, 0) 0 48%,
      rgba(96, 165, 250, .95) 74%,
      rgba(167, 139, 250, .95) 86%,
      rgba(52, 211, 153, .85) 94%,
      rgba(96, 165, 250, 0) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }
  .orb.active .ring { opacity: 1; animation: spin 1.5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--badge-bg);
    color: var(--badge-text);
    font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    border: 1.5px solid rgba(10, 12, 18, 0.55);
    display: none;
    pointer-events: none;
  }
  .orb.active .badge { display: block; }
  /* Docked right → the right half is clipped → keep badges on the visible side. */
  .stage.edge-right .badge { right: auto; left: -4px; }
  .stage.edge-right .att { right: auto; left: 0; }
  .att {
    position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(10, 12, 18, 0.6);
    background: transparent;
    display: none;
    pointer-events: none;
  }
  .att.show { display: block; animation: pop .35s ease; }
  .att.approval { background: #fbbf24; }
  .att.question  { background: #f472b6; }
  .att.done      { background: #e2e8f0; border-color: rgba(120, 130, 150, 0.9); }
  body.light .att { border-color: rgba(255, 255, 255, 0.8); }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .orb.offline .whale, .orb.missing .whale { opacity: .45; }
  .orb.offline, .orb.missing { filter: saturate(.2); }
  .orb.offline .ring, .orb.missing .ring { opacity: .5; background: conic-gradient(from 0deg, transparent 0 60%, rgba(148, 163, 184, .7) 85%, transparent); animation: spin 6s linear infinite; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="shift" id="shift">
      <div class="orb" id="orb">
        <div class="ring"></div>
        <img class="whale" src="../build/icon.png" alt="" draggable="false" />
        <div class="badge" id="badge">0</div>
        <div class="att" id="att"></div>
      </div>
    </div>
  </div>
<script>
  var cfg = null
  var st = { side: 'right', docked: true, edgeSnap: true }

  function applyShift() {
    var s = (cfg ? (cfg.orbSize || 56) : 56) + 16 // container size = orb + 2× margin
    var v = 0
    if (st.edgeSnap && st.docked) v = st.side === 'right' ? Math.round(s / 2) : -Math.round(s / 2)
    document.documentElement.style.setProperty('--shift', v + 'px')
  }

  function render(d) {
    st = d
    var orb = document.getElementById('orb')
    document.getElementById('stage').classList.toggle('edge-right', !!d.edgeSnap && !!d.docked && d.side === 'right')
    applyShift()
    orb.className = 'orb' + (d.mode === 'active' ? ' active' : d.mode === 'idle' ? '' : ' ' + d.mode)
    document.getElementById('badge').textContent = String(d.runningCount || 0)
    var att = document.getElementById('att')
    var a = d.attention || {}
    var want = a.approval ? 'approval' : a.question ? 'question' : a.unread ? 'done' : null
    var attClass = 'att' + (want ? ' show ' + want : '')
    if (att.className !== attClass) {
      att.className = attClass
      if (want) { att.style.animation = 'none'; void att.offsetWidth; att.style.animation = '' }
    }
  }

  function applyCfg() {
    if (!cfg) return
    document.documentElement.style.setProperty('--alpha', String(cfg.opacity))
    document.documentElement.style.setProperty('--orb', (cfg.orbSize || 56) + 'px')
    document.body.classList.toggle('light', cfg.theme === 'light')
    applyShift()
  }

  // Cursor-driven drag: the renderer sends NO coordinates at all — the main
  // process reads the DIP cursor itself (immune to per-monitor DPI scaling).
  ;(function () {
    var orb = document.getElementById('orb')
    orb.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return
      e.preventDefault()
      try { orb.setPointerCapture(e.pointerId) } catch (err) {}
      document.body.classList.add('dragging')
      window.overlayAPI.dragStart()
      var raf = 0
      function tick() {
        raf = 0
        window.overlayAPI.dragTick()
      }
      function move() {
        if (!raf) raf = requestAnimationFrame(tick)
      }
      function up() {
        orb.removeEventListener('pointermove', move)
        orb.removeEventListener('pointerup', up)
        orb.removeEventListener('pointercancel', up)
        if (raf) cancelAnimationFrame(raf)
        document.body.classList.remove('dragging')
        window.overlayAPI.dragUp()
      }
      orb.addEventListener('pointermove', move)
      orb.addEventListener('pointerup', up)
      orb.addEventListener('pointercancel', up)
    })
    orb.addEventListener('contextmenu', function (e) {
      e.preventDefault()
      window.overlayAPI.context()
    })
  })()

  // Hover is bound to the whole container: the clipped half still reacts, so
  // touching anywhere near the docked edge wakes the whale up.
  var stage = document.getElementById('stage')
  stage.addEventListener('mouseenter', function () { window.overlayAPI.hover(true) })
  stage.addEventListener('mouseleave', function () { window.overlayAPI.hover(false) })

  window.overlayAPI.onState(render)
  window.overlayAPI.onConfig(function (c) { cfg = c; applyCfg() })
  window.overlayAPI.ready()
</script>
</body>
</html>
